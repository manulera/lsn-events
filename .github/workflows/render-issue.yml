name: Render TSV from Issue

on:
    issues:
        types: [opened]

permissions:
    contents: write
    pull-requests: write
    issues: write

jobs:
    build:
        runs-on: ubuntu-latest

        steps:
            - name: Comment start
              uses: peter-evans/create-or-update-comment@v4
              with:
                  issue-number: ${{ github.event.issue.number }}
                  body: |
                      ⚙️ Rendering workflow started for the TSV attached to this issue.

            - name: Checkout repository
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.11"

            - name: Install Poetry
              run: pip install poetry

            - name: Install dependencies
              run: poetry install --no-interaction

            - name: Download TSV attachment
              id: prepare
              env:
                  ISSUE_BODY: ${{ github.event.issue.body }}
              run: python prepare_issue_event.py

            - name: Render event HTML
              run: |
                  poetry run python render.py "${{ steps.prepare.outputs.tsv_path }}" dist

            - name: Create pull request
              id: cpr
              uses: peter-evans/create-pull-request@v6
              with:
                  add-paths: |
                      data/
                      dist/
                  branch: issue-${{ github.event.issue.number }}-event
                  delete-branch: true
                  title: "Add event for issue #${{ github.event.issue.number }}"
                  body: |
                      Automated rendering triggered by issue #${{ github.event.issue.number }}.
                  commit-message: "Add rendered event for issue #${{ github.event.issue.number }}"

            - name: Comment completion
              if: always()
              uses: peter-evans/create-or-update-comment@v4
              with:
                  issue-number: ${{ github.event.issue.number }}
                  body: |
                      ✅ Rendering workflow finished with status `${{ job.status }}`.
                      Pull request: ${{ steps.cpr.outputs.pull-request-url || 'not created' }}
